name: CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Run tests
        run: go test ./...

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      APP_ENV: ${{ secrets.APP_ENV }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Check deploy secrets
        run: |
          test -n "$DEPLOY_HOST" || (echo "Missing DEPLOY_HOST" && exit 1)
          test -n "$DEPLOY_USER" || (echo "Missing DEPLOY_USER" && exit 1)
          test -n "$DEPLOY_SSH_KEY" || (echo "Missing DEPLOY_SSH_KEY" && exit 1)

      - name: Build
        run: |
          mkdir -p release/config release/docs release/web
          go build -trimpath -ldflags="-s -w" -o release/smarterp ./cmd/server
          cp -r web/. release/web/
          cp -r docs/. release/docs/
          cp config/*.example.json release/config/
          tar -czf smarterp-release.tar.gz -C release .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/smarterp_deploy_key
          chmod 600 ~/.ssh/smarterp_deploy_key

      - name: Upload release
        run: |
          PORT="${DEPLOY_PORT:-22}"
          scp -P "$PORT" -i ~/.ssh/smarterp_deploy_key -o StrictHostKeyChecking=no smarterp-release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/smarterp-release.tar.gz"
          if [ -n "$APP_ENV" ]; then
            printf '%s\n' "$APP_ENV" > smarterp.env
            scp -P "$PORT" -i ~/.ssh/smarterp_deploy_key -o StrictHostKeyChecking=no smarterp.env "$DEPLOY_USER@$DEPLOY_HOST:/tmp/smarterp.env"
          else
            ssh -p "$PORT" -i ~/.ssh/smarterp_deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "rm -f /tmp/smarterp.env"
          fi

      - name: Deploy release
        run: |
          PORT="${DEPLOY_PORT:-22}"
          REMOTE_DEPLOY_PATH="${DEPLOY_PATH:-~/smarterp}"
          ssh -p "$PORT" -i ~/.ssh/smarterp_deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$REMOTE_DEPLOY_PATH' bash -s" <<'EOF'
          set -euo pipefail

          DEPLOY_PATH="${DEPLOY_PATH/#\~/$HOME}"
          RELEASE_ID="$(date +%Y%m%d%H%M%S)"
          RELEASE_DIR="$DEPLOY_PATH/releases/$RELEASE_ID"
          SHARED_DIR="$DEPLOY_PATH/shared"

          mkdir -p "$RELEASE_DIR" "$SHARED_DIR/config" "$SHARED_DIR/data" "$DEPLOY_PATH/logs"
          tar -xzf /tmp/smarterp-release.tar.gz -C "$RELEASE_DIR"
          chmod +x "$RELEASE_DIR/smarterp"

          if [ -f /tmp/smarterp.env ]; then
            mv /tmp/smarterp.env "$SHARED_DIR/.env"
            chmod 600 "$SHARED_DIR/.env"
          elif [ ! -f "$SHARED_DIR/.env" ]; then
            touch "$SHARED_DIR/.env"
            chmod 600 "$SHARED_DIR/.env"
          fi

          ln -sfn "$SHARED_DIR/data" "$RELEASE_DIR/data"
          for config_file in ai.local.json db.local.json; do
            if [ -f "$SHARED_DIR/config/$config_file" ]; then
              ln -sfn "$SHARED_DIR/config/$config_file" "$RELEASE_DIR/config/$config_file"
            fi
          done

          ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"

          if command -v systemctl >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
                SUDO="sudo"
              fi
            fi

            if [ "$(id -u)" -eq 0 ] || [ -n "$SUDO" ]; then
              RUN_USER="$(id -un)"
              cat > /tmp/smarterp.service <<SERVICE
          [Unit]
          Description=SmartERP
          After=network.target

          [Service]
          Type=simple
          User=$RUN_USER
          WorkingDirectory=$DEPLOY_PATH/current
          Environment=ADDR=:8080
          EnvironmentFile=-$SHARED_DIR/.env
          ExecStart=$DEPLOY_PATH/current/smarterp
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          SERVICE
              $SUDO mv /tmp/smarterp.service /etc/systemd/system/smarterp.service
              $SUDO systemctl daemon-reload
              $SUDO systemctl enable smarterp
              $SUDO systemctl restart smarterp
              exit 0
            fi
          fi

          if [ -f "$SHARED_DIR/smarterp.pid" ]; then
            old_pid="$(cat "$SHARED_DIR/smarterp.pid" || true)"
            if [ -n "$old_pid" ] && kill -0 "$old_pid" >/dev/null 2>&1; then
              kill "$old_pid" || true
              sleep 2
            fi
          fi

          set -a
          if [ -s "$SHARED_DIR/.env" ]; then
            . "$SHARED_DIR/.env"
          fi
          set +a
          cd "$DEPLOY_PATH/current"
          nohup ./smarterp > "$DEPLOY_PATH/logs/smarterp.log" 2>&1 &
          echo "$!" > "$SHARED_DIR/smarterp.pid"
          EOF
